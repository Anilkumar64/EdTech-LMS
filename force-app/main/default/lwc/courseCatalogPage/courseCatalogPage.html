<template>
    <lightning-card title="Course Catalog" icon-name="standard:education">
        <div class="slds-p-around_medium catalog-container">

            <!-- Filters -->
            <div class="filters">
                <div class="filter-item">
                    <lightning-combobox label="Level" value={levelFilter} options={levelOptions}
                        onchange={handleLevelChange}>
                    </lightning-combobox>
                </div>
                <div class="filter-item">
                    <lightning-input type="number" label="Min Duration (hrs)" value={minDuration}
                        onchange={handleDurationChange}>
                    </lightning-input>
                </div>
                <div class="filter-item">
                    <lightning-input type="number" label="Max Price" value={maxPrice} onchange={handlePriceChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- Loading -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading courses"></lightning-spinner>
            </template>

            <!-- Error -->
            <template if:true={error}>
                <div class="slds-text-color_error slds-text-align_center">
                    Unable to load courses.
                </div>
            </template>

            <!-- Course Cards -->
            <template if:false={isLoading}>
                <div class="course-grid">
                    <template for:each={filteredCourses} for:item="course">
                        <c-course-card key={course.Id} course={course} onenroll={handleEnroll}>
                        </c-course-card>
                    </template>
                </div>

                <template if:true={hasNoCourses}>
                    <div class="no-courses">
                        No courses match your filters.
                    </div>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
