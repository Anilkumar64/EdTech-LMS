<template>
    <lightning-card title="Course Progress" icon-name="standard:education">
        <div class="slds-p-around_medium">

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading progress"></lightning-spinner>
            </template>

            <template if:true={error}>
                <div class="slds-text-color_error">
                    Unable to load progress.
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:false={error}>
                    <p class="slds-text-heading_small slds-m-bottom_small">
                        {progressLabel}
                    </p>

                    <lightning-progress-bar value={progress} variant={progressVariant} size="large">
                    </lightning-progress-bar>

                    <div class="slds-m-top_medium">
                        <p><strong>Assignment Status:</strong> {assignmentStatus}</p>
                        <p><strong>Assessment Result:</strong> {assessmentResult}</p>
                    </div>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
